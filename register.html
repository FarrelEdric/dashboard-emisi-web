<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Daftar | Dashboard Emisi Karbon</title>
    <link
      rel="icon"
      type="image/png"
      href="static/img/favicon.png"
    />
    <link
      rel="stylesheet"
      href="static/fonts/exo2.css"
    />
    <link
      rel="stylesheet"
      href="static/style.css"
    />
  </head>
  <body class="lg">
    <form method="post">
      <div class="brand brand-auth" aria-label="AirNav Indonesia logo">
        <div class="brand-mark">
          <img
            class="brand-logo"
            src="static/img/logo-airnav.png"
            alt="AirNav Indonesia"
          />
        </div>
      </div>
      <h1>Buat akun</h1>
      <p>Akun baru harus disetujui admin sebelum bisa masuk.</p>
      
      <input type="hidden" name="csrf" value="9e082dd77b782ef7d2b3930bd9ad7451" />
      <label for="u">Username</label>
      <input
        id="u"
        name="username"
        required
        autofocus
        autocomplete="username"
        minlength="3"
        maxlength="30"
        pattern="[A-Za-z0-9_]+"
        title="Huruf, angka, atau garis bawah"
      />
      <label for="p">Password (minimal 8 karakter)</label>
      <input
        id="p"
        name="password"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
      />
      <label for="p2">Ulangi password</label>
      <input
        id="p2"
        name="password2"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
      />
      <button class="btn">Daftar</button>
      <p class="alt">
        Sudah punya akun? <a href="login.html">Masuk</a>
      </p>
    </form>
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0b3a5c;color:#fff;
font:14px/1.5 system-ui,sans-serif;padding:10px 16px;text-align:center">
<strong>Demo statis</strong> — dibuat dari dashboard asli. Login, pendaftaran akun, dan penyimpanan data
tidak aktif karena ini hosting statis GitHub Pages. Data yang tampil adalah data nyata dari database lokal.
</div>
</body>
</html>
