<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | Dashboard Emisi Karbon</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="lg">
<form method="post">
<h1>✈ Dashboard Emisi Karbon</h1>
<p>Silakan masuk untuk melihat dashboard.</p>
{% for m in get_flashed_messages() %}<div class="okm" role="status">{{ m }}</div>{% endfor %}
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<input type="hidden" name="csrf" value="{{ csrf() }}">
<label for="u">Username</label>
<input id="u" name="username" required autofocus autocomplete="username">
<label for="p">Password</label>
<input id="p" name="password" type="password" required autocomplete="current-password">
<button class="btn">Masuk</button>
<p class="alt">Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a></p>
</form>
</body>
</html>
